<!DOCTYPE html><html lang=zh><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=color-scheme content="light dark">
<title>云打印</title>
<style>
:root{--paper:#FAF8F4;--card:#FFF;--ink:#1A1713;--dim:#6B6459;--line:#E4DFD5;
--accent:#2E7D4F;--accent-ink:#FFF;--danger:#A33A2A;--ok-bg:#E8F2EA;--err-bg:#F7E9E6;--info-bg:#ECEFF2;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
--ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#15130F;--card:#1E1B16;
--ink:#EDE9E1;--dim:#948C7E;--line:#312C25;--accent:#5FBF83;--accent-ink:#10231A;--danger:#E08A78;
--ok-bg:#1B2E22;--err-bg:#3A2320;--info-bg:#242019}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui);
min-height:100svh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.w{max-width:560px;margin:0 auto;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
.dev{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.dev b{font:600 13px/1 var(--mono);letter-spacing:.06em}
.dev span{color:var(--dim);font:12px/1 var(--mono);margin-left:auto}
h1{font-size:23px;margin:20px 0 6px;letter-spacing:-.015em}
.sub{color:var(--dim);font-size:14px;margin:0 0 20px}
label.drop{display:block;border:1.5px dashed var(--line);border-radius:14px;background:var(--card);
padding:32px 20px;text-align:center;cursor:pointer;margin-bottom:14px}
label.drop:active{border-color:var(--accent)}
.drop .big{font-size:17px;font-weight:600;margin-bottom:4px}
.drop .hint{color:var(--dim);font-size:13px}
input[type=file]{display:none}
button{width:100%;min-height:50px;padding:14px;border:0;border-radius:12px;background:var(--accent);
color:var(--accent-ink);font:600 16px var(--ui);cursor:pointer}
button:active{opacity:.75}button:disabled{background:var(--line);color:var(--dim)}
#msg{display:none;padding:13px 14px;border-radius:12px;margin-bottom:14px;font-size:14.5px;background:var(--info-bg)}
#msg.ok{background:var(--ok-bg);color:var(--accent)}#msg.err{background:var(--err-bg);color:var(--danger)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
ul{list-style:none;padding:0;margin:0}
li{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
margin-bottom:8px;display:flex;align-items:center;gap:12px}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.st{font:12px/1 var(--mono);padding:4px 7px;border-radius:5px;background:var(--info-bg);color:var(--dim);flex:none}
.st.done{background:var(--ok-bg);color:var(--accent)}.st.failed{background:var(--err-bg);color:var(--danger)}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px}
.prn{font-size:13px;color:var(--dim);margin:-6px 0 14px;display:flex;gap:8px;align-items:center}
.prn b{color:var(--fg);font-weight:600}
.warn{color:#d1495b;font-weight:600}
</style></head><body><div class=w>
<div class=dev><span class=dot id=dot></span><b>CLOUD PRINT</b><span id=devid>连接中…</span></div>
<div class=prn id=prn></div>
<h1>发送到打印机</h1>
<p class=sub>选一个 PDF、图片或文本文件，服务器会渲染好再发给家里的打印机。</p>
<div id=msg></div>
<label class=drop for=f>
  <div class=big id=fname>选择文件</div>
  <div class=hint>支持 PDF / JPG / PNG / TXT，最大 50MB</div>
</label>
<input type=file id=f accept=".pdf,.jpg,.jpeg,.png,.txt,application/pdf,image/*,text/plain">
<button id=go onclick=send() disabled>打印</button>
<p class=eyebrow>最近作业</p>
<ul id=jobs><li class=empty>暂无</li></ul>
</div><script>
var file=null;
function m(t,c){var e=document.getElementById('msg');e.textContent=t;e.className=c||'';e.style.display='block'}
document.getElementById('f').onchange=function(e){
  file=e.target.files[0];
  if(file){document.getElementById('fname').textContent=file.name;
    document.getElementById('go').disabled=false}};
function send(){
  if(!file)return;
  var b=document.getElementById('go');b.disabled=true;m('上传并渲染中…');
  fetch('/api/print',{method:'POST',headers:{'X-Filename':encodeURIComponent(file.name)},body:file})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
   .then(function(x){
     if(x.ok){m('已发送，打印机正在处理（作业 '+x.j.job+'）','ok')}
     else{m(x.j.e||'失败','err')}
     b.disabled=false;poll()})
   .catch(function(){m('网络错误','err');b.disabled=false})}
function poll(){
  fetch('/api/status').then(r=>r.json()).then(function(d){
    var ks=Object.keys(d.devices||{}),on=false,id='无设备';
    if(ks.length){var v=d.devices[ks[0]];on=v.state!=='offline';
      id=ks[0].slice(-6).toUpperCase()+(on?'':' 离线')}
    document.getElementById('dot').className='dot'+(on?' on':'');
    document.getElementById('devid').textContent=id;
    // 打印机自报状态：面板文字来自 @PJL USTATUS，缺纸/故障来自 USB 类请求
    var pe=document.getElementById('prn'), t='';
    if(ks.length&&d.devices[ks[0]].prn){
      var p=d.devices[ks[0]].prn;
      if(!on) t='<span class=dim>打印桥离线</span>';
      else if(p.paper_out) t='打印机 <span class=warn>缺纸 / 开盖</span>';
      else if(p.error) t='打印机 <span class=warn>故障</span>';
      else if(p.display) t='打印机 <b>'+p.display+'</b>'+(p.asleep?'（休眠，发送后会自动唤醒）':'');
      else t='打印机 <b>'+(p.online?'在线':'未就绪')+'</b>';
    }
    pe.innerHTML=t;
    var ul=document.getElementById('jobs');
    if(!d.jobs||!d.jobs.length){ul.innerHTML='<li class=empty>暂无</li>';return}
    var names={queued:on?'排队中':'等打印桥上线',downloading:'传输中',done:'已完成',failed:'失败','no-device':'等打印桥上线'};
    ul.innerHTML='';
    d.jobs.forEach(function(j){
      var li=document.createElement('li');
      var a=document.createElement('span');a.className='nm';
      a.textContent=decodeURIComponent(j.name||'文档');
      var s=document.createElement('span');
      s.className='st'+(j.state==='done'?' done':j.state==='failed'?' failed':'');
      s.textContent=names[j.state]||j.state;
      li.appendChild(a);li.appendChild(s);ul.appendChild(li)})})
   .catch(function(){})}
poll();setInterval(poll,3000);
</script></body></html>
